<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-slate-200">
    <nav class="w-full relative h-[70px] bg-slate-400 flex justify-between px-10 md:justify-around items-center">
        <h1 class="text-xl">SciCode Acadmy</h1>
        <ul class="text-white hidden md:flex gap-10 items-center">
            <li>Home</li>
            <li>About</li>
            <li>Projects</li>
            <li>Contact</li>
        </ul>

        <span id="btn" class="block md:hidden"><i id="icon" class="fa-solid fa-bars"></i></span>
        <ul id="ul"
            class="hidden md:hidden absolute top-full left-0 flex-col w-full bg-slate-400 text-white gap-10 p-10">
            <li>Home</li>
            <li>About</li>
            <li>Projects</li>
            <li>Contact</li>
        </ul>
    </nav>

    <section class="w-full gap-10 flex flex-col justify-center items-center h-screen bg-blue">

        <form id="form"
            class="md:w-[800px] w-[90%]  bg-white fill-white drop-shadow-xl/25 rounded-md h-[70px] flex items-center justify-center gap-4">
            <input id="inp" placeholder="Enter your to do list" class="w-[80%] outline-none px-4 h-full " type="text">

            <button class="w-[20%] h-full bg-green-500 text-white text-lg cursor-pointer">add</button>
        </form>



        <form id="editform"
            class=" hidden md:w-[800px] w-[90%]  bg-white fill-white drop-shadow-xl/25 rounded-md h-[70px] items-center justify-center gap-4">
            <input id="editinp" placeholder="Enter your to do list" class="w-[80%] outline-none px-4 h-full " type="text">
            <button class="w-[20%] h-full bg-green-500 text-white text-lg cursor-pointer">update</button>
        </form>



        <ul id="list"
            class="md:w-[800px] w-[90%]  flex flex-col gap-4 p-10 rounded-md min-h-300px bg-white fill-white drop-shadow-xl/25">
            <!-- <li class="w-full flex justify-between items-center p-4 rounded-md bg-slate-300">${task.title}

                <div class="flex gap-5">
                    <span class="text-black-500"><i class="fa-solid fa-pencil"></i></span>
                    <span class="text-red-500"><i class="fa-solid fa-trash"></i></span>
                </div>

            </li> -->



        </ul>

    </section>



    <script src="./index.js"></script>

</body>

</html>
